  <!-- the loading screen, styled before anything else arrives: our mark draws itself, the name rises beneath it -->
  <style>
    .loader { position: fixed; inset: 0; z-index: 300; display: grid; place-items: center; background: #E6D3B7;
      transition: opacity .7s cubic-bezier(.22, .61, .36, 1), visibility 0s .7s; }
    .loader.is-done { opacity: 0; visibility: hidden; }
    .loader__inner { display: grid; justify-items: center; gap: 16px; transition: transform .9s cubic-bezier(.22, .61, .36, 1); }
    .loader.is-done .loader__inner { transform: translateY(-16px) scale(1.04); }
    .loader__mark { width: 78px; height: auto; overflow: visible; }
    .loader__ink { fill: none; stroke: #B4592A; stroke-width: 84; stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 1 1.1; stroke-dashoffset: 1.05; animation: ld-draw 1.5s cubic-bezier(.65, 0, .35, 1) .1s forwards; }
    .loader__word { display: flex; margin: 0; font: 700 2.5rem/1 DynaPuff, system-ui, sans-serif; letter-spacing: -.01em; color: #B4592A; }
    .loader__word span { display: inline-block; opacity: 0; transform: translateY(16px);
      animation: ld-rise .65s cubic-bezier(.22, .61, .36, 1) forwards; animation-delay: calc(.6s + var(--i) * .06s); }
    .loader:not(.has-font) .loader__word span { animation-play-state: paused; }
    .loader__bar { display: block; width: 124px; height: 3px; margin-top: 8px; border-radius: 3px; background: rgba(58, 33, 22, .12); overflow: hidden; }
    .loader__bar i { display: block; height: 100%; border-radius: 3px; background: #B4592A; transform-origin: 0 50%; transform: scaleX(.08);
      transition: transform .7s cubic-bezier(.22, .61, .36, 1); }
    @keyframes ld-draw { to { stroke-dashoffset: 0; } }
    @keyframes ld-rise { to { opacity: 1; transform: none; } }
    html.is-loading, html.is-loading body { overflow: hidden; }
    @media (prefers-reduced-motion: reduce) {
      .loader__ink { animation: none; stroke-dashoffset: 0; }
      .loader__word span { animation: none; opacity: 1; transform: none; }
    }
  </style>
  <noscript><style>.loader { display: none; }</style></noscript>
