<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Zweig – backen</title></head>
<body><script type="module">
// Bakes the plant into one picture: the mirrored branch photo, the leaves and the extra cherries in their order,
// each casting a soft shadow onto what lies under it and onto the paper. The hero cherry is not in it (the page
// lays the real one, and then the 3D one, on top). window.bake(cfg, S, cropX) → { url, meta }
const load = (src) => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = src; });
window.bake = async (cfg, S, cropX) => {
  const items = [];
  for (const L of cfg.layers) {
    const im = await load(L.src); const w = L.w, h = w * im.naturalHeight / im.naturalWidth;
    items.push({ im, w, h, x: L.x, y: L.y, rot: (L.rot || 0) * Math.PI / 180, flip: !!L.flip, z: L.z ?? 0, filter: L.filter || 'none' });
  }
  const zw = await load(cfg.zweig.src);
  // the plate's extent: every layer's turned box, and the branch up to where it fades out
  let x0 = 0, y0 = 0, x1 = cropX, y1 = 2527;
  for (const it of items) for (const [u, v] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
    const dx = u * it.w / 2, dy = v * it.h / 2;
    const X = it.x + dx * Math.cos(it.rot) - dy * Math.sin(it.rot), Y = it.y + dx * Math.sin(it.rot) + dy * Math.cos(it.rot);
    x0 = Math.min(x0, X); y0 = Math.min(y0, Y); x1 = Math.max(x1, X); y1 = Math.max(y1, Y);
  }
  const pad = 120; x0 -= pad; y0 -= pad; x1 += pad; y1 += pad;
  const W = Math.ceil((x1 - x0) * S), H = Math.ceil((y1 - y0) * S);
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d'); g.imageSmoothingQuality = 'high';
  g.setTransform(S, 0, 0, S, -x0 * S, -y0 * S);
  // a soft shadow, as from a window up left: down and to the right of each thing, onto the paper behind
  const shade = (on) => { g.shadowColor = on ? 'rgba(58, 33, 22, .26)' : 'transparent'; g.shadowBlur = on ? 46 * S : 0; g.shadowOffsetX = on ? 26 * S : 0; g.shadowOffsetY = on ? 40 * S : 0; };
  const draw = (it) => {
    g.save(); g.translate(it.x, it.y); g.rotate(it.rot); if (it.flip) g.scale(-1, 1);
    g.filter = it.filter; g.drawImage(it.im, -it.w / 2, -it.h / 2, it.w, it.h); g.restore();
  };
  const branch = () => {
    g.save(); g.beginPath(); g.rect(0, 0, cropX, 2527); g.clip();
    g.translate(4992, 0); g.scale(-1, 1); g.drawImage(zw, 0, 0, 4992, 2527); g.restore();
  };
  shade(true);
  for (const z of [0, 1, 2, 3, 4]) {
    for (const it of items.filter((i) => i.z === z)) draw(it);
    if (z === 1) branch();
  }
  // where the hero cherry lies, the picture is left empty (a hair inside its outline): the real cherry is laid on
  // top by the page, and while both fade in or out nothing of the leaves behind it shows through it
  if (cfg.hole) {
    const k = await load(cfg.hole.src), [a, b, c, d, e, f] = cfg.hole.matrix, [hx, hy] = cfg.hole.centre, sh = cfg.hole.shrink || .985;
    g.save(); shade(false); g.globalCompositeOperation = 'destination-out';
    g.translate(hx, hy); g.scale(sh, sh); g.translate(-hx, -hy);
    g.transform(a, b, c, d, e, f);
    g.drawImage(k, 0, 0, 1011, 1253);
    g.restore(); g.globalCompositeOperation = 'source-over';
  }
  // beyond cropX the branch fades out, so on very wide screens it ends softly instead of in a cut
  g.setTransform(S, 0, 0, S, -x0 * S, -y0 * S); shade(false);
  g.globalCompositeOperation = 'destination-in';
  const fade = g.createLinearGradient(cropX - 700, 0, cropX, 0);
  fade.addColorStop(0, '#000'); fade.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = fade; g.fillRect(x0, y0, x1 - x0, y1 - y0);
  const url = c.toDataURL('image/png');
  return { url, meta: { width: W, height: H, scale: S, origin: [x0, y0] } };
};
document.body.dataset.ready = '1';
</script></body></html>
